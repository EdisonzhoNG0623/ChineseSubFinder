on:
  push:
    branches: [master]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [master]

# for cache
# checkout https://github.com/magnetikonline/action-golang-cache
# https://www.lorenzobettini.it/2020/12/caching-dependencies-in-github-actions/
# https://github.com/mongodb/mongocli/actions/runs/1637632940/workflow

name: GO tests

jobs:
  tests:
    strategy:
      matrix:
        go-version: [1.17]
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
      - name: Compile P0-P2 core packages
        if: runner.os == 'Linux'
        run: go test -run '^$' ./internal/backend/... ./pkg/downloader ./pkg/save_sub_helper ./pkg/task_queue
      - name: Test
        run: go test ./pkg/gss/
